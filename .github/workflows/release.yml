name: Release npm package

# npm trusted publishing binds @hasna/mementos to this workflow filename and
# the npm-release environment below. Keep both names aligned with the registry
# configuration; this workflow deliberately has no long-lived-token fallback.

on:
  push:
    tags:
      - "npm/mementos/v*"

concurrency:
  group: hasna-mementos-npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'hasna/mementos'
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Verify npm supports trusted publishing
        run: |
          set -euo pipefail
          have="$(npm --version)"
          need="11.5.1"
          if [ "$(printf '%s\n%s\n' "${need}" "${have}" | sort -V | head -n1)" != "${need}" ]; then
            echo "::error::npm ${have} is older than ${need}; trusted publishing is unavailable"
            exit 1
          fi
          echo "npm ${have} meets the ${need} trusted-publishing minimum"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Bind the tag to the package version
        id: version
        run: |
          set -euo pipefail
          expected_name="@hasna/mementos"
          expected_prefix="npm/mementos/v"
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"

          if [ "${pkg_name}" != "${expected_name}" ]; then
            echo "::error::package.json names ${pkg_name}, expected ${expected_name}"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::release workflow requires a tag ref"
            exit 1
          fi
          case "${GITHUB_REF_NAME}" in
            npm/mementos/v*)
              tag_version="${GITHUB_REF_NAME#npm/mementos/v}" ;;
            *)
              echo "::error::tag ${GITHUB_REF_NAME} does not start with ${expected_prefix}"
              exit 1 ;;
          esac
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} carries ${tag_version}, package.json declares ${pkg_version}"
            exit 1
          fi

          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          checkout_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${GITHUB_SHA}" ] || [ "${checkout_commit}" != "${GITHUB_SHA}" ]; then
            echo "::error::tag ref, event SHA, and checked-out commit do not agree"
            exit 1
          fi

          echo "name=${pkg_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${pkg_version}" >> "${GITHUB_OUTPUT}"
          echo "tag ${GITHUB_REF_NAME}, package ${pkg_name}@${pkg_version}, and commit ${GITHUB_SHA} agree"

      - name: Require the release commit on protected main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/main"; then
            echo "::error::release commit ${GITHUB_SHA} is not contained in current protected main"
            exit 1
          fi
          echo "release commit ${GITHUB_SHA} is contained in current protected main"

      - name: Reject an already published version
        run: |
          set -euo pipefail
          name="${{ steps.version.outputs.name }}"
          version="${{ steps.version.outputs.version }}"
          cache_dir="$(mktemp -d)"
          stdout_file="${cache_dir}/npm-view.out"
          stderr_file="${cache_dir}/npm-view.err"
          trap 'rm -rf "${cache_dir}"' EXIT

          set +e
          npm_config_cache="${cache_dir}" npm view "${name}@${version}" version >"${stdout_file}" 2>"${stderr_file}"
          query_rc=$?
          set -e

          if [ "${query_rc}" -eq 0 ]; then
            echo "::error::${name}@${version} is already published and npm versions are immutable"
            exit 1
          fi
          if ! grep -Eq 'code E404|E404' "${stderr_file}"; then
            sed -n '1,20p' "${stderr_file}" >&2
            echo "::error::registry preflight failed with rc=${query_rc}; refusing to treat it as an unpublished version"
            exit "${query_rc}"
          fi
          echo "${name}@${version} is not yet published"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish to npm via OIDC trusted publishing
        run: npm publish --provenance --access public

      - name: Verify the published version and provenance from the registry
        run: |
          set -euo pipefail
          name="${{ steps.version.outputs.name }}"
          version="${{ steps.version.outputs.version }}"

          # Node 24.18.0 bundles npm 11.16.0, whose `npm view` command requests
          # full metadata. Five fresh-cache reads at ten-second spacing span
          # forty seconds, beyond the measured 10.8-second purge convergence.
          for attempt in 1 2 3 4 5; do
            cache_dir="$(mktemp -d)"
            metadata_file="${cache_dir}/metadata.json"

            set +e
            npm_config_cache="${cache_dir}" npm view "${name}@${version}" version dist.attestations --json >"${metadata_file}"
            query_rc=$?
            set -e

            if [ "${query_rc}" -eq 0 ] && node - "${version}" "${metadata_file}" <<'NODE'
          const { readFileSync } = require("node:fs");
          const [expectedVersion, metadataPath] = process.argv.slice(2);
          const metadata = JSON.parse(readFileSync(metadataPath, "utf8"));
          const predicateType = metadata["dist.attestations"]?.provenance?.predicateType;

          if (metadata.version !== expectedVersion) {
            console.error(`registry resolved ${expectedVersion} to ${metadata.version}`);
            process.exit(1);
          }
          if (predicateType !== "https://slsa.dev/provenance/v1") {
            console.error(`registry has no SLSA provenance for ${expectedVersion}`);
            process.exit(1);
          }
          NODE
            then
              rm -rf "${cache_dir}"
              echo "registry serves ${name}@${version} with SLSA provenance"
              exit 0
            fi

            rm -rf "${cache_dir}"
            echo "attempt ${attempt}: ${name}@${version} or its provenance is not visible yet; waiting"
            sleep 10
          done

          echo "::error::${name}@${version} with SLSA provenance did not become visible after publish"
          exit 1
